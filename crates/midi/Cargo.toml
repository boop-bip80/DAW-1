[package]
name = "soundcraft-midi"
description = "SoundCraft MIDI: note/controller sequences, Standard MIDI File import/export, MIDI editing operations, GM names"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true

# The hardware backend is native-only. Keep the core sequence and live-byte parser usable in WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = "0.5"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
midir = "0.11"

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
