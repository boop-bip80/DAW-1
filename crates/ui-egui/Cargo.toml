[package]
name = "soundcraft-ui-egui"
description = "SoundCraft's egui user interface: Edit and Mix windows, transport, dialogs, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository.workspace = true

[dependencies]
craft-ui.workspace = true
soundcraft-time.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host.workspace = true
soundcraft-vst3-host.workspace = true
soundcraft-au-host.workspace = true
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-engine.workspace = true
soundcraft-playback.workspace = true
soundcraft-video.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
image.workspace = true
# The Arabic dictionary's translations are handed out in visual order (i18n/bidi.rs): a UAX #9
# reordering pass for egui's run-by-run, left-to-right text layout.
unicode-bidi = "0.3.18"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

[lints]
workspace = true

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

# Craft AI's model-runtime bridge (`craft_ai/engine.rs`): the loopback HTTP client. Native only —
# the web build draws the window's note instead, and ureq's TLS stack does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "2", features = ["json"] }

