[package]
name = "soundcraft"
description = "SoundCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "soundcraft"

[lints]
workspace = true

[features]
# ASIO audio devices on Windows (see soundcraft-playback's `asio` feature).
asio = ["soundcraft-playback/asio"]

[dependencies]
soundcraft-engine.workspace = true
soundcraft-ui-egui.workspace = true
soundcraft-playback.workspace = true
# Cloud storage transport: the blocking CollabCraft client that the desktop
# worker thread uses.  No provider credential or provider URL lives here.
craft-cloud-client.workspace = true
# Shared editing: relay token minted by the service, handed to the hub.
craft-collab.workspace = true
collabcraft-share.workspace = true
# The relay client is async; NativeHub needs a runtime to live on.
tokio = { version = "1", features = ["rt-multi-thread"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd.workspace = true

[build-dependencies]
# Icon + VERSIONINFO for soundcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19.2", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }
