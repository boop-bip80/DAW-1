name: CI

# Run the full Rust quality gate on all three primary desktop OSes. This fork's
# default branch is build/craft-update-495e597, not main. Keep the push and PR
# filters aligned so an ordinary commit to the active branch actually runs CI.
on:
  push:
    branches: [build/craft-update-495e597, release]
  pull_request:
    branches: [build/craft-update-495e597]
  workflow_dispatch:

permissions:
  contents: read

# Newer PR commits cancel obsolete gate runs; default-branch commits finish.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # The reusable gate runs cargo xtask ci, including format, Clippy, unit
    # tests, doctests, asset attribution, layer checks and WASM checks.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["ubuntu-24.04","macos-latest","windows-latest"]'
      windows-env: 'SOUNDCRAFT_REQUIRE_WINRES=1'
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev libasound2-dev
