[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.12.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/soundcraft"

[workspace.dependencies]
# internal
soundcraft-time = { path = "crates/time" }
soundcraft-audio-io = { path = "crates/audio-io" }
soundcraft-midi = { path = "crates/midi" }
soundcraft-video = { path = "crates/video" }
soundcraft-dsp = { path = "crates/dsp" }
soundcraft-clap-host = { path = "crates/clap-host" }
soundcraft-vst3-host = { path = "crates/vst3-host" }
soundcraft-au-host = { path = "crates/au-host" }
soundcraft-model = { path = "crates/model" }
soundcraft-mix = { path = "crates/mix" }
soundcraft-engine = { path = "crates/engine" }
soundcraft-playback = { path = "crates/playback" }
soundcraft-automation = { path = "crates/automation" }
soundcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
proptest = "1"

# audio
# Main's dependabot bump to 0.6.1 left audio-io on the 0.5 API. Stay on 0.5 until that port lands.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "ogg", "wav", "pcm", "aiff", "isomp4", "aac", "alac", "adpcm", "caf", "mkv"] }
rustfft = "6"
# Session bundles (one file holding a session and its audio, for the browser): stored entries only.
zip = { version = "9", default-features = false }
cpal = "0.16"

# Which file paths stored in a session may be opened.
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }

# ui
# Pinned at the same rev every CollabCraft-integrated Craft app uses so all
# crates resolve to a single copy. Cloud and presence are feature-gated; only
# the crates that draw cloud UI enable them.
# Main moved egui to 0.37; craft-ui cloud still targets 0.36, so stay on 0.36 until #160 lands.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "289d562cc6e8b567819aee51f759a78f41a65454", features = ["serde"] }
craft-cloud = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "289d562cc6e8b567819aee51f759a78f41a65454" }
# How every Craft app desktop host reaches CollabCraft: blocking client for the
# worker thread (desktop) and async client for the browser.  No provider
# credential, no provider URL and no provider protocol live in this workspace.
craft-cloud-client = { git = "https://github.com/wdunn001/collab-craft", rev = "80bfaec" }
# Shared editing relay client (presence + real-time co-editing hand-off).
craft-collab = { git = "https://github.com/wdunn001/collab-craft", rev = "80bfaec", features = ["native-hub"] }
collabcraft-share = { git = "https://github.com/wdunn001/collab-craft", rev = "80bfaec" }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
